[project]
name = "anonymizer"
version = "0.1.0"
description = "Find and anonymize sensitive entities in text with pre-trained NER models and regex, with a benchmark, a Streamlit demo and a FastAPI endpoint"
readme = "README.md"
authors = [
    { name = "Derrick DD Van Frausum", email = "derrick.vanfrausum@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm",
    "fastapi>=0.141.1",
    "gliner>=0.2.29",
    "ollama>=0.6.2",
    "pandas>=3.0.6",
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "spacy>=3.8.16",
    "streamlit>=1.64.0",
    "transformers>=5.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
anonymizer = "anonymizer:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "notebook>=7.6.3",
]
